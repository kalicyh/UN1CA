name: Update prebuilt blobs (dm3qkxx)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      S918N_IMEI: ${{ secrets.S918N_IMEI }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        run: |
          source ./buildenv.sh a52sxq
          FIRMWARE="SM-S918N/KOO/ENV"
          if [ ! -d "./prebuilts/samsung/dm3qkxx" ]; then
            cp -a "./prebuilts/samsung/dm3qcxx" "./prebuilts/samsung/dm3qkxx"
          fi
          if [ -z "$S918N_IMEI" ]; then
            echo "S918N_IMEI is not set, fallback to matrix firmware" >&2
          else
            FIRMWARE="SM-S918N/KOO/${S918N_IMEI}"
          fi
          ./scripts/internal/update_prebuilt_blobs.sh "dm3qkxx" "$FIRMWARE"
          echo "PDA_BUILD=$(cat "./prebuilts/samsung/dm3qkxx/.current" | cut -d "/" -f "1")" >> "$GITHUB_ENV"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            prebuilts/samsung/dm3qkxx
          commit-message: 'prebuilts/samsung/dm3qkxx: update blobs to ${{ env.PDA_BUILD }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/samsung/dm3qkxx'
          delete-branch: true
          title: 'Update prebuilts/samsung/dm3qkxx blobs to ${{ env.PDA_BUILD }}'
          body: ''
